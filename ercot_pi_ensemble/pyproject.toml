[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ensemble"
version = "0.1.0"
description = "Physics-informed interpretable CNN + Transformer ensemble for ERCOT load forecasting"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "shap>=0.44",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["pi_ensemble"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
